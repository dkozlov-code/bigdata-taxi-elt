name: Data Pipeline CI/CD
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false
env:
  PREFECT_SERVER_ANALYTICS_ENABLED: 'false'
  DO_NOT_TRACK: '1'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run ruff check .
      # pytest выполняет реальные GX checkpoints и dbt build (включая dbt test).
      - run: uv run pytest -q
      - run: docker compose build
  staging:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run python -m pipeline.release stage
      - uses: actions/upload-artifact@v7
        with:
          name: staging-${{ github.sha }}
          path: runtime/release/
          retention-days: 7
  production:
    needs: staging
    runs-on: ubuntu-latest
    # В GitHub необходимо включить Required reviewers для этого Environment.
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - uses: actions/download-artifact@v8
        with:
          name: staging-${{ github.sha }}
          path: runtime/release/
      - name: Require configured production review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/production" > environment.json
          python -c 'import json; c=json.load(open("environment.json")); assert any(r["type"]=="required_reviewers" for r in c["protection_rules"]), "Configure production Required reviewers before deployment"'
      - name: Restore previous production artifact for comparison and rollback
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false and (.name | startswith("production-"))) | [.workflow_run.id, .name] | @tsv' > artifacts.tsv
          if [ -s artifacts.tsv ]; then
            read -r run artifact < artifacts.tsv
            gh run download "$run" --name "$artifact" --dir runtime/release/production
          fi
      - run: uv run python -m pipeline.release promote
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: production-${{ github.sha }}
          path: runtime/release/production/
          retention-days: 30
